# Dependabot configuration — keeps npm dependencies current.
# Docs: https://docs.github.com/en/code-security/dependabot
version: 2

updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      - name: 'dependencies'
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
      - name: 'dev-dependencies (major)'
        applies-to: version-updates
        update-types:
          - 'major'
        patterns:
          - '*'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'deps'
