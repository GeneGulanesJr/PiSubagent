name: dependency-review

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          # Fail the PR on moderate-or-higher severity vulnerabilities.
          fail-on-severity: moderate
          # Comment on the PR with a vulnerability summary (default behavior).
          comment-summary-in-pr: always
          # Allow the audit to also surface license issues if desired.
          # (Optional — uncomment to enforce.)
          # license-check: true
