name: release

on:
  push:
    tags: ['v*']

# Contents write is required to create a GitHub release.
permissions:
  contents: write

jobs:
  release:
    name: Build, test, and publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Sanity-check the tagged commit: dist/ artifacts must compile and the
      # test suite must still pass. Distribution itself is via
      # `pi install git:...` (no npm publish step).
      - name: Build and test
        run: npm run build && npm test

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
