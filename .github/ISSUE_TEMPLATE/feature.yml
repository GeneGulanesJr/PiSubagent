name: Feature Request
description: Suggest an enhancement to the subagent tool.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? What user need does it address?
      placeholder: "I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should this work? Be specific about the public API (subagent tool params, agent frontmatter, etc.).
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed and why this one is better.
  - type: dropdown
    id: mode
    attributes:
      label: Affected mode (if any)
      options:
        - single
        - parallel
        - chain
        - all modes
        - not applicable