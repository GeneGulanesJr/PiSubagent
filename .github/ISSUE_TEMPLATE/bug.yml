name: Bug Report
description: Report a bug in the subagent tool.
title: '[Bug]: '
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill in the
        sections below so we can reproduce and fix the issue quickly.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear, concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Reproduction steps
      description: Minimal steps to reproduce the behavior.
      placeholder: |
        1. Install pi-subagent@0.1.0
        2. Define an agent in `~/.pi/agent/agents/foo.md`
        3. Run `subagent({ agent: "foo", task: "..." })`
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What you expected to happen instead.
    validations:
      required: true

  - type: dropdown
    id: affected-mode
    attributes:
      label: Affected mode
      description: Which dispatch mode exhibits the bug?
      options:
        - single
        - parallel
        - chain
        - all
        - 'not sure'
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Versions and platform.
      placeholder: |
        pi version: 0.x.y
        node -v:    v22.x.y
        OS:         macOS 14 / Ubuntu 24.04 / Windows 11
        pi-subagent: 0.1.0
    validations:
      required: true

  - type: textarea
    id: test-output
    attributes:
      label: npm test output
      description: |
        Paste the full output of `npm test` (or the failing test) here.
        Leave blank if not applicable.
    validations:
      required: false
